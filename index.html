<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>記帳記事 Pro</title>

  <link rel="manifest" href="manifest.json">

  <meta name="theme-color" content="#047857" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <!-- Tailwind CSS CDN for pure standalone single-file execution -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#ecfdf5',
              100: '#d1fae5',
              500: '#10b981',
              600: '#059669',
              700: '#047857',
              800: '#065f46',
              900: '#064e3b',
            }
          }
        }
      }
    }
  </script>
  <style>
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    body { margin: 0; padding: 0; background-color: #f8fafc; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; user-select: none; }
    /* Hide scrollbars for app-like feeling */
    ::-webkit-scrollbar { width: 0px; height: 0px; background: transparent; }
    .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 flex justify-center min-h-screen">
  
  <!-- APP SHELL CONTAINER (Responsive: Fullscreen on mobile, Max-w-md on desktop) -->
  <div id="app-container" class="w-full max-w-md min-h-screen bg-white flex flex-col shadow-2xl relative overflow-hidden">
    
    <!-- TOP HEADER -->
    <header class="bg-gradient-to-r from-emerald-700 via-teal-700 to-slate-900 text-white px-4 py-3.5 flex items-center justify-between shrink-0 shadow-md">
      <div class="flex items-center space-x-2.5">
        <div class="w-9 h-9 rounded-xl bg-white/10 border border-white/20 flex items-center justify-center text-emerald-300 font-black text-lg">
          📒
        </div>
        <div>
          <h1 class="text-base font-bold tracking-tight text-white flex items-center gap-1.5">
            <span>記帳記事 Pro</span>
            <span class="text-[9px] font-mono px-1.5 py-0.5 rounded bg-emerald-500/20 text-emerald-300 border border-emerald-400/30">
              PRO
            </span>
          </h1>
          <div class="flex items-center gap-1.5 text-[10px] text-emerald-200/90">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
            <span>離線本機儲存 · 自動備份</span>
          </div>
        </div>
      </div>
      <button id="add-btn" class="w-9 h-9 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-white flex items-center justify-center font-bold text-xl shadow-md transition-transform active:scale-95 cursor-pointer">
        +
      </button>
    </header>

    <!-- DATE & LUNAR BANNER -->
    <div id="date-banner" class="bg-slate-900 text-white px-4 py-2 flex items-center justify-between text-xs border-b border-slate-800">
      <div class="flex items-center space-x-2 font-medium">
        <span class="text-emerald-400">📅</span>
        <span id="current-solar-date">2026/09/16 (三)</span>
      </div>
      <div class="text-[11px] text-amber-300 font-serif" id="current-lunar-date">
        農曆八月初六
      </div>
    </div>

    <!-- MAIN SCROLLABLE CONTENT AREA -->
    <main id="tab-content" class="flex-1 overflow-y-auto p-4 space-y-4 pb-20">
      <!-- Injected via JavaScript based on Active Tab -->
    </main>

    <!-- BOTTOM 3-TAB NAVIGATION -->
    <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t border-slate-200 px-4 py-2 flex items-center justify-around z-20 shadow-lg">
      <button id="tab-btn-accounting" class="flex flex-col items-center gap-0.5 text-teal-600 font-bold transition-transform active:scale-95">
        <span class="text-lg">👛</span>
        <span class="text-[11px]">記帳管理</span>
      </button>
      <button id="tab-btn-notes" class="flex flex-col items-center gap-0.5 text-slate-500 hover:text-slate-800 transition-transform active:scale-95 relative">
        <span class="text-lg">📝</span>
        <span class="text-[11px]">記事警示</span>
        <span id="note-badge" class="hidden absolute -top-1 right-1 w-4 h-4 bg-rose-500 text-white text-[9px] font-bold rounded-full flex items-center justify-center">0</span>
      </button>
      <button id="tab-btn-backup" class="flex flex-col items-center gap-0.5 text-slate-500 hover:text-slate-800 transition-transform active:scale-95">
        <span class="text-lg">🛡️</span>
        <span class="text-[11px]">備份中心</span>
      </button>
    </nav>
  </div>

  <!-- MODAL FOR ADDING/EDITING EXPENSE OR NOTE -->
  <div id="modal-container" class="fixed inset-0 bg-black/60 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 hidden">
    <div id="modal-box" class="w-full max-w-md bg-white rounded-t-2xl sm:rounded-2xl p-5 shadow-2xl animate-fade-in max-h-[90vh] overflow-y-auto">
      <!-- Modal Content Dynamic -->
    </div>
  </div>

  <!-- APP JAVASCRIPT LOGIC -->
  <script>
    (function() {
      // 1. Initial State & Persistent Keys
      var STORAGE_EXPENSES_KEY = 'pure_app_expenses_v1';
      var STORAGE_NOTES_KEY = 'pure_app_notes_v1';

      var defaultExpenses = [
  {
    "id": "exp-1",
    "type": "expense",
    "category": "餐飲飲食",
    "amount": 120,
    "date": "2026-09-16",
    "note": "午餐牛肉麵 + 滷蛋"
  },
  {
    "id": "exp-2",
    "type": "expense",
    "category": "日常購物",
    "amount": 350,
    "date": "2026-09-15",
    "note": "全聯生活用品"
  },
  {
    "id": "exp-3",
    "type": "income",
    "category": "薪資收入",
    "amount": 52000,
    "date": "2026-09-05",
    "note": "九月份本薪匯入"
  },
  {
    "id": "exp-4",
    "type": "expense",
    "category": "交通出行",
    "amount": 80,
    "date": "2026-09-14",
    "note": "捷運儲值"
  }
];

      var defaultNotes = [
  {
    "id": "note-1",
    "title": "繳納自來水與天然氣帳單",
    "content": "記得於 20 日前線上繳款完畢，避免產生滯納金。",
    "date": "2026-09-18",
    "tag": "帳單",
    "priority": "high"
  },
  {
    "id": "note-2",
    "title": "每週車輛保養檢查",
    "content": "五油三水檢查、輪胎胎壓確認。",
    "date": "2026-09-22",
    "tag": "生活",
    "priority": "normal"
  }
];

      var expenses = [];
      try {
        var savedExp = localStorage.getItem(STORAGE_EXPENSES_KEY);
        expenses = savedExp ? JSON.parse(savedExp) : defaultExpenses;
      } catch(e) { expenses = defaultExpenses; }

      var notes = [];
      try {
        var savedNotes = localStorage.getItem(STORAGE_NOTES_KEY);
        notes = savedNotes ? JSON.parse(savedNotes) : defaultNotes;
      } catch(e) { notes = defaultNotes; }

      var activeTab = 'accounting'; // 'accounting' | 'notes' | 'backup'

      function saveExpenses() {
        localStorage.setItem(STORAGE_EXPENSES_KEY, JSON.stringify(expenses));
      }
      function saveNotes() {
        localStorage.setItem(STORAGE_NOTES_KEY, JSON.stringify(notes));
      }

      // Date update
      var now = new Date();
      var solarStr = now.getFullYear() + '/' + String(now.getMonth() + 1).padStart(2, '0') + '/' + String(now.getDate()).padStart(2, '0');
      var dayNames = ['日', '一', '二', '三', '四', '五', '六'];
      document.getElementById('current-solar-date').textContent = solarStr + ' (' + dayNames[now.getDay()] + ')';

      // Navigation handler
      function setTab(tab) {
        activeTab = tab;
        var btnAcc = document.getElementById('tab-btn-accounting');
        var btnNotes = document.getElementById('tab-btn-notes');
        var btnBackup = document.getElementById('tab-btn-backup');

        btnAcc.className = 'flex flex-col items-center gap-0.5 ' + (tab === 'accounting' ? 'text-teal-600 font-bold scale-105' : 'text-slate-500 hover:text-slate-800');
        btnNotes.className = 'flex flex-col items-center gap-0.5 relative ' + (tab === 'notes' ? 'text-teal-600 font-bold scale-105' : 'text-slate-500 hover:text-slate-800');
        btnBackup.className = 'flex flex-col items-center gap-0.5 ' + (tab === 'backup' ? 'text-teal-600 font-bold scale-105' : 'text-slate-500 hover:text-slate-800');

        renderContent();
      }

      document.getElementById('tab-btn-accounting').onclick = function() { setTab('accounting'); };
      document.getElementById('tab-btn-notes').onclick = function() { setTab('notes'); };
      document.getElementById('tab-btn-backup').onclick = function() { setTab('backup'); };

      // Render tab views
      function renderContent() {
        var container = document.getElementById('tab-content');
        if (activeTab === 'accounting') {
          renderAccountingView(container);
        } else if (activeTab === 'notes') {
          renderNotesView(container);
        } else if (activeTab === 'backup') {
          renderBackupView(container);
        }
      }

      function renderAccountingView(container) {
        var totalIncome = 0;
        var totalExpense = 0;
        expenses.forEach(function(e) {
          if (e.type === 'income') totalIncome += Number(e.amount);
          else totalExpense += Number(e.amount);
        });
        var balance = totalIncome - totalExpense;

        var html = '' +
          '<div class="bg-gradient-to-br from-emerald-600 to-teal-800 text-white rounded-2xl p-4 shadow-md space-y-3">' +
            '<div class="text-xs text-emerald-100 font-medium">當前收支總結餘</div>' +
            '<div class="text-3xl font-black tracking-tight">NT$ ' + balance.toLocaleString() + '</div>' +
            '<div class="grid grid-cols-2 gap-2 pt-2 border-t border-emerald-500/30 text-xs">' +
              '<div><span class="text-emerald-200">總收入：</span><strong class="text-emerald-100 font-mono">+' + totalIncome.toLocaleString() + '</strong></div>' +
              '<div><span class="text-emerald-200">總支出：</span><strong class="text-emerald-100 font-mono">-' + totalExpense.toLocaleString() + '</strong></div>' +
            '</div>' +
          '</div>' +

          '<div class="space-y-2">' +
            '<div class="flex items-center justify-between">' +
              '<h3 class="font-bold text-xs text-slate-800">最新帳目明細 (' + expenses.length + ' 筆)</h3>' +
            '</div>' +
            '<div class="space-y-2">';

        if (expenses.length === 0) {
          html += '<div class="text-center py-8 text-slate-400 text-xs">目前尚無帳目記錄，點擊右上角「+」開始記帳！</div>';
        } else {
          expenses.forEach(function(item) {
            var isInc = item.type === 'income';
            html += '' +
              '<div class="bg-white border border-slate-200 rounded-xl p-3 flex items-center justify-between shadow-xs">' +
                '<div class="flex items-center space-x-3">' +
                  '<div class="w-8 h-8 rounded-lg ' + (isInc ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700') + ' flex items-center justify-center text-sm font-bold">' +
                    (isInc ? '入' : '支') +
                  '</div>' +
                  '<div>' +
                    '<div class="font-bold text-xs text-slate-900">' + item.category + '</div>' +
                    '<div class="text-[10px] text-slate-500">' + item.date + (item.note ? ' · ' + item.note : '') + '</div>' +
                  '</div>' +
                '</div>' +
                '<div class="text-right">' +
                  '<div class="font-mono font-bold text-xs ' + (isInc ? 'text-emerald-600' : 'text-rose-600') + '">' +
                    (isInc ? '+' : '-') + Number(item.amount).toLocaleString() +
                  '</div>' +
                  '<button onclick="window.deleteExpense(\'' + item.id + '\')" class="text-[10px] text-slate-400 hover:text-rose-500">刪除</button>' +
                '</div>' +
              '</div>';
          });
        }

        html += '</div></div>';
        container.innerHTML = html;
      }

      function renderNotesView(container) {
        var html = '' +
          '<div class="space-y-3">' +
            '<div class="flex items-center justify-between">' +
              '<h3 class="font-bold text-xs text-slate-800">代辦備忘與重要警示 (' + notes.length + ' 則)</h3>' +
            '</div>' +
            '<div class="space-y-2.5">';

        if (notes.length === 0) {
          html += '<div class="text-center py-8 text-slate-400 text-xs">目前無記事，點擊右上角「+」新增備忘！</div>';
        } else {
          notes.forEach(function(n) {
            html += '' +
              '<div class="bg-white border border-slate-200 rounded-xl p-3 shadow-xs space-y-2">' +
                '<div class="flex items-center justify-between">' +
                  '<span class="text-[10px] font-bold px-2 py-0.5 rounded bg-teal-50 text-teal-700 border border-teal-200">' + (n.tag || '記事') + '</span>' +
                  '<div class="flex items-center gap-2">' +
                    '<span class="text-[10px] text-slate-400 font-mono">' + n.date + '</span>' +
                    '<button onclick="window.deleteNote(\'' + n.id + '\')" class="text-[10px] text-slate-400 hover:text-rose-500">刪除</button>' +
                  '</div>' +
                '</div>' +
                '<h4 class="font-bold text-xs text-slate-900">' + n.title + '</h4>' +
                '<p class="text-[11px] text-slate-600 leading-relaxed">' + n.content + '</p>' +
              '</div>';
          });
        }

        html += '</div></div>';
        container.innerHTML = html;
      }

      function renderBackupView(container) {
        var html = '' +
          '<div class="space-y-4">' +
            '<div class="bg-emerald-50 border border-emerald-200 rounded-2xl p-4 text-emerald-950 space-y-2">' +
              '<h3 class="font-bold text-xs flex items-center gap-1.5">' +
                '<span>🛡️ 本機資料快照與離線安全防護</span>' +
              '</h3>' +
              '<p class="text-[11px] text-emerald-800 leading-relaxed">' +
                '所有資料均安全存放在您的手機本機空間，斷網離線皆可完整使用。更換新手機或清除快取前，請先匯出備份檔案。' +
              '</p>' +
            '</div>' +

            '<div class="bg-white border border-slate-200 rounded-2xl p-4 space-y-3 shadow-xs">' +
              '<h4 class="font-bold text-xs text-slate-900">資料手動備份與跨設備還原</h4>' +
              '<div class="grid grid-cols-2 gap-2">' +
                '<button onclick="window.exportDataJson()" class="bg-teal-600 hover:bg-teal-500 text-white py-2 px-3 rounded-xl font-bold text-xs flex items-center justify-center gap-1 shadow-xs cursor-pointer">' +
                  '<span>匯出備份 JSON</span>' +
                '</button>' +
                '<label class="bg-slate-100 hover:bg-slate-200 text-slate-800 border border-slate-300 py-2 px-3 rounded-xl font-bold text-xs flex items-center justify-center gap-1 cursor-pointer">' +
                  '<span>匯入還原檔</span>' +
                  '<input type="file" accept=".json" onchange="window.importDataJson(event)" class="hidden" />' +
                '</label>' +
              '</div>' +
            '</div>' +

            '<div class="bg-stone-50 border border-stone-200 rounded-2xl p-4 space-y-2 text-stone-600 text-xs">' +
              '<div class="font-bold text-stone-800">軟體資訊</div>' +
              '<div>版本：純淨專業版 (完全離線單機版)</div>' +
              '<div>作者：Cbjm (LINE: bojen010)</div>' +
            '</div>' +
          '</div>';

        container.innerHTML = html;
      }

      // Global helper actions
      window.deleteExpense = function(id) {
        if (!confirm('確定刪除此筆記錄？')) return;
        expenses = expenses.filter(function(e) { return e.id !== id; });
        saveExpenses();
        renderContent();
      };

      window.deleteNote = function(id) {
        if (!confirm('確定刪除此記事？')) return;
        notes = notes.filter(function(n) { return n.id !== id; });
        saveNotes();
        renderContent();
      };

      window.exportDataJson = function() {
        var data = {
          version: '1.0',
          appName: '記帳記事 Pro',
          exportTime: new Date().toISOString(),
          expenses: expenses,
          notes: notes
        };
        var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = '記帳記事 Pro_完整資料備份_' + (new Date().toISOString().split('T')[0]) + '.json';
        a.click();
        URL.revokeObjectURL(url);
      };

      window.importDataJson = function(evt) {
        var file = evt.target.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function(e) {
          try {
            var parsed = JSON.parse(e.target.result);
            if (parsed.expenses && Array.isArray(parsed.expenses)) {
              expenses = parsed.expenses;
              saveExpenses();
            }
            if (parsed.notes && Array.isArray(parsed.notes)) {
              notes = parsed.notes;
              saveNotes();
            }
            alert('✓ 備份資料還原成功！');
            renderContent();
          } catch(err) {
            alert('檔案格式錯誤，無法解析！');
          }
        };
        reader.readAsText(file);
      };

      // Modal Add New Item
      var modalContainer = document.getElementById('modal-container');
      var modalBox = document.getElementById('modal-box');
      document.getElementById('add-btn').onclick = function() {
        if (activeTab === 'notes') {
          openAddNoteModal();
        } else {
          openAddExpenseModal();
        }
      };

      function openAddExpenseModal() {
        modalBox.innerHTML = '' +
          '<div class="space-y-4">' +
            '<div class="flex items-center justify-between border-b border-slate-100 pb-2">' +
              '<h3 class="font-bold text-sm text-slate-800">新增帳目記錄</h3>' +
              '<button id="modal-close-btn" class="text-slate-400 hover:text-slate-700 text-lg cursor-pointer">✕</button>' +
            '</div>' +
            '<div class="grid grid-cols-2 gap-2">' +
              '<button type="button" id="type-exp" class="py-2 bg-rose-600 text-white rounded-xl text-xs font-bold cursor-pointer">支出</button>' +
              '<button type="button" id="type-inc" class="py-2 bg-slate-100 text-slate-700 rounded-xl text-xs font-bold cursor-pointer">收入</button>' +
            '</div>' +
            '<div>' +
              '<label class="text-[11px] font-bold text-slate-600 block mb-1">金額 (NT$)</label>' +
              '<input id="inp-amount" type="number" placeholder="0" class="w-full border border-slate-300 rounded-xl p-2.5 text-base font-mono font-bold" />' +
            '</div>' +
            '<div>' +
              '<label class="text-[11px] font-bold text-slate-600 block mb-1">類別</label>' +
              '<select id="inp-category" class="w-full border border-slate-300 rounded-xl p-2.5 text-xs font-medium">' +
                '<option>餐飲飲食</option><option>日常購物</option><option>交通出行</option><option>娛樂休閒</option><option>醫療保健</option><option>薪資收入</option><option>其他雜支</option>' +
              '</select>' +
            '</div>' +
            '<div>' +
              '<label class="text-[11px] font-bold text-slate-600 block mb-1">備註說明</label>' +
              '<input id="inp-note" type="text" placeholder="例如：跟同事聚餐" class="w-full border border-slate-300 rounded-xl p-2.5 text-xs" />' +
            '</div>' +
            '<button id="save-exp-btn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white py-3 rounded-xl font-bold text-sm shadow-md cursor-pointer">' +
              '儲存記錄' +
            '</button>' +
          '</div>';

        modalContainer.classList.remove('hidden');
        var selectedType = 'expense';

        document.getElementById('type-exp').onclick = function() {
          selectedType = 'expense';
          this.className = 'py-2 bg-rose-600 text-white rounded-xl text-xs font-bold cursor-pointer';
          document.getElementById('type-inc').className = 'py-2 bg-slate-100 text-slate-700 rounded-xl text-xs font-bold cursor-pointer';
        };
        document.getElementById('type-inc').onclick = function() {
          selectedType = 'income';
          this.className = 'py-2 bg-emerald-600 text-white rounded-xl text-xs font-bold cursor-pointer';
          document.getElementById('type-exp').className = 'py-2 bg-slate-100 text-slate-700 rounded-xl text-xs font-bold cursor-pointer';
        };

        document.getElementById('modal-close-btn').onclick = function() {
          modalContainer.classList.add('hidden');
        };

        document.getElementById('save-exp-btn').onclick = function() {
          var amt = document.getElementById('inp-amount').value;
          if (!amt || Number(amt) <= 0) {
            alert('請輸入有效金額！');
            return;
          }
          var cat = document.getElementById('inp-category').value;
          var note = document.getElementById('inp-note').value;
          var item = {
            id: 'exp-' + Date.now(),
            type: selectedType,
            category: cat,
            amount: Number(amt),
            date: new Date().toISOString().split('T')[0],
            note: note
          };
          expenses.unshift(item);
          saveExpenses();
          modalContainer.classList.add('hidden');
          renderContent();
        };
      }

      function openAddNoteModal() {
        modalBox.innerHTML = '' +
          '<div class="space-y-4">' +
            '<div class="flex items-center justify-between border-b border-slate-100 pb-2">' +
              '<h3 class="font-bold text-sm text-slate-800">新增記事備忘</h3>' +
              '<button id="modal-close-btn" class="text-slate-400 hover:text-slate-700 text-lg cursor-pointer">✕</button>' +
            '</div>' +
            '<div>' +
              '<label class="text-[11px] font-bold text-slate-600 block mb-1">記事標題</label>' +
              '<input id="inp-note-title" type="text" placeholder="例如：定期繳水費" class="w-full border border-slate-300 rounded-xl p-2.5 text-xs font-bold" />' +
            '</div>' +
            '<div>' +
              '<label class="text-[11px] font-bold text-slate-600 block mb-1">分類標籤</label>' +
              '<input id="inp-note-tag" type="text" placeholder="帳單 / 生活 / 工作" class="w-full border border-slate-300 rounded-xl p-2.5 text-xs" />' +
            '</div>' +
            '<div>' +
              '<label class="text-[11px] font-bold text-slate-600 block mb-1">詳細內容</label>' +
              '<textarea id="inp-note-content" rows="3" placeholder="請填寫詳細說明..." class="w-full border border-slate-300 rounded-xl p-2.5 text-xs"></textarea>' +
            '</div>' +
            '<button id="save-note-btn" class="w-full bg-teal-600 hover:bg-teal-500 text-white py-3 rounded-xl font-bold text-sm shadow-md cursor-pointer">' +
              '儲存記事' +
            '</button>' +
          '</div>';

        modalContainer.classList.remove('hidden');

        document.getElementById('modal-close-btn').onclick = function() {
          modalContainer.classList.add('hidden');
        };

        document.getElementById('save-note-btn').onclick = function() {
          var title = document.getElementById('inp-note-title').value;
          if (!title) {
            alert('請輸入記事標題！');
            return;
          }
          var tag = document.getElementById('inp-note-tag').value || '備忘';
          var content = document.getElementById('inp-note-content').value;
          var item = {
            id: 'note-' + Date.now(),
            title: title,
            content: content,
            tag: tag,
            date: new Date().toISOString().split('T')[0]
          };
          notes.unshift(item);
          saveNotes();
          modalContainer.classList.add('hidden');
          renderContent();
        };
      }

      // Initial Render
      renderContent();
    })();
  </script>

<script>
(function() {
  var AUTH_STORAGE_KEY = 'cbjm_app_passcode_unlocked_v1';
  var DEVICE_STORAGE_KEY = 'cbjm_app_device_id_v1';
  var SALT = 'CBJM_SECURE_2026';

  // 1. 檢查是否已經解鎖過
  try {
    if (localStorage.getItem(AUTH_STORAGE_KEY) === 'true') {
      return; // 已授權，完全不顯示門禁
    }
  } catch(e) {}

  // 2. 獲取或產生專屬設備號 (一機一碼)
  var deviceId = '';
  try {
    deviceId = localStorage.getItem(DEVICE_STORAGE_KEY);
  } catch(e) {}

  if (!deviceId) {
    var chars = '23456789ABCDEFGHJKLMNPQRSTUVWXYZ';
    var p1 = '', p2 = '';
    for (var i = 0; i < 4; i++) p1 += chars.charAt(Math.floor(Math.random() * chars.length));
    for (var j = 0; j < 2; j++) p2 += chars.charAt(Math.floor(Math.random() * chars.length));
    deviceId = 'DEV-' + p1 + '-' + p2;
    try {
      localStorage.setItem(DEVICE_STORAGE_KEY, deviceId);
    } catch(e) {}
  }

  // 3. 顯示門禁遮罩
  var overlay = document.getElementById('cbjm-universal-gate-overlay');
  var devDisplay = document.getElementById('cbjm-display-device-id');
  if (overlay && devDisplay) {
    devDisplay.textContent = deviceId;
    overlay.style.display = 'flex';
  }

  // 4. 複製按鈕
  var copyBtn = document.getElementById('cbjm-btn-copy');
  if (copyBtn) {
    copyBtn.onclick = function() {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(deviceId);
      }
      alert('已複製本機特徵碼：' + deviceId);
    };
  }

  // 5. LINE 索取
  var lineBtn = document.getElementById('cbjm-btn-line');
  if (lineBtn) {
    lineBtn.onclick = function() {
      var msg = '作者 Cbjm 您好，我的軟體特徵碼為：' + deviceId;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(msg);
      }
      alert('已複製特徵碼！正在引導前往 LINE (bojen010)');
      window.open('https://line.me/ti/p/~bojen010', '_blank');
    };
  }

  // 6. 郵件索取
  var emailBtn = document.getElementById('cbjm-btn-email');
  if (emailBtn) {
    emailBtn.onclick = function() {
      var subject = encodeURIComponent('[專用軟體] 授權通關密碼申請 (' + deviceId + ')');
      var body = encodeURIComponent('作者 Cbjm 您好：\n\n我的設備特徵碼為：' + deviceId + '\n請提供專屬授權通關密碼，謝謝！');
      window.location.href = 'mailto:bojen010@gmail.com?subject=' + subject + '&body=' + body;
    };
  }

  // 7. 內建安全雜湊換算演算法
  function simpleHash(str) {
    var hash = 0;
    for (var i = 0; i < str.length; i++) {
      hash = ((hash << 5) - hash) + str.charCodeAt(i);
      hash |= 0;
    }
    return Math.abs(hash);
  }

  function computeValidPasscode(devId) {
    var clean = (devId || '').trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
    var h1 = simpleHash(clean + '_' + SALT);
    var h2 = simpleHash(SALT + '_' + clean + '_REVERSE');
    // 6 位純阿拉伯數字
    var num = (h1 * 31 + h2 * 17) % 900000 + 100000;
    return num.toString();
  }

  // 8. 驗證輸入邏輯
  var verifyBtn = document.getElementById('cbjm-btn-verify');
  var verifyBtnBig = document.getElementById('cbjm-btn-verify-big');
  var inputEl = document.getElementById('cbjm-input-passcode');
  var msgEl = document.getElementById('cbjm-verify-msg');

  function doVerify() {
    if (!inputEl || !msgEl) return;
    var val = (inputEl.value || '').trim().toUpperCase();
    if (!val) {
      msgEl.style.display = 'block';
      msgEl.style.color = '#d97706';
      msgEl.textContent = '請先輸入 6 位數字通關密碼！';
      inputEl.focus();
      return;
    }
    var correct = computeValidPasscode(deviceId);
    
    // 支援 6 位純數字密碼、通用萬用密碼 (739201, 888888, 123456) 以及舊版 8K9P-4X2M
    if (val === correct || val === '739201' || val === '888888' || val === '123456' || val === '8K9P-4X2M') {
      msgEl.style.display = 'block';
      msgEl.style.color = '#059669';
      msgEl.textContent = '✓ 認證成功！正在為您開啟軟體...';
      try {
        localStorage.setItem(AUTH_STORAGE_KEY, 'true');
      } catch(e) {}
      setTimeout(function() {
        overlay.style.display = 'none';
      }, 500);
    } else {
      msgEl.style.display = 'block';
      msgEl.style.color = '#e11d48';
      msgEl.textContent = '✕ 密碼錯誤，請重新確認或聯繫作者！';
    }
  }

  if (verifyBtn) verifyBtn.onclick = doVerify;
  if (verifyBtnBig) verifyBtnBig.onclick = doVerify;
  if (inputEl) {
    inputEl.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        doVerify();
      }
    });
  }
})();
</script>
